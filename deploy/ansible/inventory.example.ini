# Copy to inventory.ini and edit. One line per DSpace server.
[dspace_servers]
repo.example.org ansible_user=ubuntu

[dspace_servers:vars]
# Everything in roles/dspace_sentinel/defaults/main.yml can be overridden here or, better, in
# group_vars/dspace_servers/main.yml (needed for the dictionaries and for the lists of Telegram
# bots and email recipients). Use that directory only: once group_vars/dspace_servers/ exists,
# Ansible ignores a group_vars/dspace_servers.yml file next to it. See docs/ANSIBLE.md.
#
# dspace_sentinel_version=main
# dspace_sentinel_persona=full
# dspace_sentinel_hostname=repo-1
#
# Secrets belong in ansible-vault: define them in group_vars/dspace_servers/vault.yml
# (ansible-vault create) and reference them from group_vars/dspace_servers/main.yml:
#   dspace_sentinel_login_password_hash: "{{ vault_sentinel_login_hash }}"  # ./sentinel.sh hash-password
#   dspace_sentinel_auth_token: "{{ vault_sentinel_auth_token }}"
#   dspace_sentinel_postgres_password: "{{ vault_sentinel_pg_password }}"
#   dspace_sentinel_email_password: "{{ vault_sentinel_gmail_app_password }}"
#   dspace_sentinel_telegram_bots:        # up to 5, one bot per person
#     - {label: Danindu, bot_token: "{{ vault_sentinel_bot_danindu }}", chat_id: "123456789"}
# An older single bot (dspace_sentinel_telegram.chat_id + dspace_sentinel_telegram_bot_token)
# still works as one bot.
