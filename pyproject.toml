[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dspace-sentinel"
version = "0.1.0"
description = "Lightweight, observe-only observability and health dashboard for DSpace 7, 8 and 9 repository servers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DSpace Sentinel contributors" }]
keywords = ["dspace", "monitoring", "observability", "repository", "solr", "postgresql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psutil>=5.9,<8",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.1,<4",
  "jinja2>=3.1,<4",
  "pyyaml>=6.0,<7",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16,<0.17", "playwright>=1.45"]

[project.urls]
Homepage = "https://github.com/Danindu05/dspace-sentinel"
Issues = "https://github.com/Danindu05/dspace-sentinel/issues"

[project.scripts]
dspace-sentinel = "dspace_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["dspace_sentinel*"]

[tool.setuptools.package-data]
dspace_sentinel = ["static/**/*", "reports/templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: Playwright browser smoke tests; run with SENTINEL_E2E=1 pytest tests/e2e"]
filterwarnings = ["ignore::DeprecationWarning"]
