line-length = 110
target-version = "py310"
extend-exclude = [".venv", "data", "docs"]

[lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = []

[lint.per-file-ignores]
# Long literal lines in the demo dataset and the boxed doctor output are intentional.
"dspace_sentinel/collectors/demo.py" = ["E501"]
"dspace_sentinel/cli.py" = ["E501"]

[lint.isort]
known-first-party = ["dspace_sentinel"]

[lint.flake8-bugbear]
# FastAPI's dependency injection idiom: Depends()/Query()/Body() in defaults is intended.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.Path"]
