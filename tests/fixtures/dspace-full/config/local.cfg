# local.cfg of a full DSpace 8 stack (fixture)
dspace.dir = /opt/dspace
dspace.name = Test Repository
dspace.server.url = https://repo.example.org/server
dspace.ui.url = https://repo.example.org

# Database
db.url = jdbc:postgresql://127.0.0.1:5433/dspace8?sslmode=prefer
db.username = dspace_ro
db.password = s3cret

# Solr
solr.server = http://127.0.0.1:8983/solr

# storage / logs use ${dspace.dir}
assetstore.dir = ${dspace.dir}/assetstore
log.report.dir = ${dspace.dir}/log

# multi-line value with continuation
event.dispatcher.default.consumers = versioning, discovery, eperson, \
    harvester

plugin.named.org.dspace.curate.CurationTask = org.dspace.ctask.general.NoOpCurationTask = noop
plugin.named.org.dspace.curate.CurationTask += org.dspace.ctask.general.ProfileFormats = profileformats
